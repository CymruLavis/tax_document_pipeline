[project]
name = "tax-document-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "orm>=0.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = [
    "I", # Import Sorting
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
